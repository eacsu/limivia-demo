[project]
name = "limivia-demo"
version = "0.1.0"
description = "LIMIVIA GPIO、PWM、麦克风及 Realtime 语音控制示例"
authors = [{name = "wangchenyu", email = "1542169671@qq.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "limivia==0.3.0",
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<0.6",
    "websockets>=14,<16",
    "python-dotenv>=1.0,<2",
    "async-timeout>=4,<6",
]

[tool.poetry]
packages = [{include = "demos"}, {include = "config.py"}]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
